<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f0e9" />
    <meta
      name="description"
      content="MONO — 暮らしのお金を、シンプルに。オフライン家計簿。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MONO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link
      rel="preload"
      href="./assets/fonts/Yomogi-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./tabi-theme.css" />
    <title>MONO — 家計簿</title>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ</a>
    <div class="app-shell">
      <header class="topbar">
        <a href="#home" class="brand" aria-label="MONO ホーム"
          ><span id="brand-icon"></span
          ><span>MONO</span></a
        >
        <div class="header-right">
          <span class="local-status" id="local-status">端末に保存</span
          ><button
            class="icon-btn"
            id="settings-button"
            aria-label="設定"
          ></button>
        </div>
      </header>
      <div class="workspace">
        <aside class="desktop-side">
          <nav id="desktop-nav" aria-label="メインメニュー"></nav>
        </aside>
        <div class="main-wrap">
          <div class="group-line">
            <div
              id="groups"
              class="group-tabs"
              role="tablist"
              aria-label="家計簿のグループ"
            ></div>
            <button
              class="icon-btn add-group"
              id="add-group"
              aria-label="グループを追加"
            ></button>
          </div>
          <main id="main" tabindex="-1">
            <div class="loading">MONOを開いています…</div>
          </main>
        </div>
      </div>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="メインメニュー"></nav>

    <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input
      id="restore-file"
      type="file"
      accept=".json,.csv,application/json,text/csv"
      hidden
    />
    <noscript
      ><p class="fatal">
        MONOを使うにはJavaScriptを有効にしてください。
      </p></noscript
    >
    <script type="module" src="./app.js"></script>
  </body>
</html>
